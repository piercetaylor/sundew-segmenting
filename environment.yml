# Mamba environment for training the sundew segmentation baselines on Hellbender.
#
# Create it once, from a compute node (never the login node):
#   module load mamba/v2.4.0
#   mamba env create -f environment.yml
#   mamba activate sundew-seg
#   pip install --no-deps -e .
#
# Environments land in the envs_dirs from ~/.condarc (pixstor, not /home).
name: sundew-seg

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  # Dataset/IO stack used by the scripts outside the model code.
  - numpy>=1.24,<3
  - pillow>=10
  # Torch is installed from the PyTorch CUDA index below rather than from
  # conda-forge: those wheels bundle their own CUDA runtime, so the job does
  # not depend on the cluster's cuda modules (only 11.7/11.8 are available,
  # which are too old for the A100/H100/L40S mix on Hellbender).
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1+cu124
      - torchvision==0.20.1+cu124
      # Segformer decoder requires smp >= 0.4.0; pyproject's >=0.3.3 is too loose.
      - segmentation-models-pytorch==0.5.0
