name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  site-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run site tests
        run: node --test "site/test/*.test.mjs"
      # The species pages are generated from data/site/ by scripts/build_site_pages.py and committed.
      - name: Check the species pages are up to date
        run: python3 scripts/build_site_pages.py --check
      - name: Keep the site's photos under 12 MB
        run: |
          bytes=$(du -sb site/img | cut -f1)
          echo "site/img: $bytes bytes"
          [ "$bytes" -le 12000000 ] || { echo "::error::site/img is $bytes bytes, over 12 MB"; exit 1; }
