[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sundew-segmentation"
version = "0.1.0"
description = "Licensed sundew image acquisition and segmentation research pipeline"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
baseline = ["segmentation-models-pytorch>=0.4.0", "torch>=2.0", "torchvision>=0.15"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
